name: Build Jekyll site

on:
  push:
    branches: [ main ]

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true
    
    - name: Build Jekyll
      run: |
        bundle install
        bundle exec jekyll build
    
    # Removed GitHub Pages deployment step as we're now using Vercel
