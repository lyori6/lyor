---
layout: default
---

<div class="blog-post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }} • {% if page.author %}{{ page.author }}{% else %}{{ site.author }}{% endif %}</p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    {% if page.tags.size > 0 %}
    <div class="post-tags">
        <p>Tags: 
            {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
            {% endfor %}
        </p>
    </div>
    {% endif %}

    <!-- Commented out navigation to fix display issues
    <div class="post-navigation">
        {% if page.previous.url %}
        <a class="prev" href="{{ site.baseurl }}{{ page.previous.url }}">&laquo; {{ page.previous.title }}</a>
        {% endif %}
        
        {% if page.next.url %}
        <a class="next" href="{{ site.baseurl }}{{ page.next.url }}">{{ page.next.title }} &raquo;</a>
        {% endif %}
    </div>
    -->
</div>
