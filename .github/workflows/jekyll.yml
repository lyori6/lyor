name: [DISABLED] Build and Deploy Jekyll site to GitHub Pages
# This workflow is disabled as we're now using Vercel for deployment
# See build-jekyll.yml for the active workflow

on:
  push:
    branches: [ none ]  # Disable this workflow by setting it to trigger on a non-existent branch

permissions:
  contents: write

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    
    - name: Build Jekyll
      run: |
        bundle install
        bundle exec jekyll build --config _config.yml,_config_github.yml
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: \${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
